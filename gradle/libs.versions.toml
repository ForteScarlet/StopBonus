[versions]
sqldelight = "2.4.1"
compose-plugin = "1.12.2"
compose-material3 = "1.9.0"
# Kotlin
kotlin = "2.4.21"
buildconfig = "6.1.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.13.0"
# logback
logback = "1.6.8"
slf4j = "2.0.20"
log4j = "2.26.1"
# https://github.com/h2database/h2database
h2 = "2.5.252"
# https://github.com/KoalaPlot/koalaplot-core
# https://koalaplot.github.io/
koalaPlot = "0.12.1"
# https://github.com/vinceglb/FileKit
filekit = "0.17.1"
# https://poi.apache.org/
apachePoi = "6.0.0"
junit = "4.13.2"

# https://conveyor.hydraulic.dev/21.0/configs/maven-gradle/#gradle
conveyor = "2.0"

[libraries]
sqldelight-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-dialect = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
# logback
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "log4j" }

# ktx
# ktx-coroutine
kotlinx-coroutine-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# h2 driver
h2db = { module = "com.h2database:h2", version.ref = "h2" }

# koalaPlot
koalaPlot-core = { group = "io.github.koalaplot", name = "koalaplot-core", version.ref = "koalaPlot" }

filekit-dialogs = { group = "io.github.vinceglb", name = "filekit-dialogs", version.ref = "filekit" }
apache-poi-ooxml = { group = "org.apache.poi", name = "poi-ooxml", version.ref = "apachePoi" }
junit4 = { module = "junit:junit", version.ref = "junit" }

[plugins]
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinKapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
buildConfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
conveyor = { id = "dev.hydraulic.conveyor", version.ref = "conveyor" }
